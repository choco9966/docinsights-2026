[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docinsights-analysis"
version = "0.1.0"
description = "DocInsights 2026 DocSem dataset download and analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.0,<2",
]

[project.scripts]
docinsights = "docinsights_analysis.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
