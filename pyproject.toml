[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docinsights-ocr"
version = "0.1.0"
description = "Qwen-facing OCR benchmark pipeline for the DocInsights 2026 DocSem task"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UPL-1.0" }
dependencies = [
  "huggingface-hub>=1.0,<2",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "pillow>=10,<13",
  "pymupdf>=1.25,<2",
]

[project.scripts]
docinsights-ocr = "docinsights_ocr.cli:main"
docinsights-hf-ocr = "docinsights_hf_ocr.cli:main"
docinsights = "docinsights_analysis.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "notebooks/01_docsem_data_analysis.ipynb",
  "notebooks/docsem_hf_small_ocr_smoke.py",
  "notebooks/docsem_hf_small_ocr_smoke_v2.py",
  "research/ocr-small-models/raw/v2/runner-executed.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
